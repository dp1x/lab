[project]
name = "lab"
version = "0.1.0"
description = "Computational Research Laboratory monorepo"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_utils"]

[tool.pytest.ini_options]
testpaths = ["research", "src"]
addopts = "-q"

[tool.uv]
package = true
